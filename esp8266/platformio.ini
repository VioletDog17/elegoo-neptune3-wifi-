[env:mks_robin_wifi]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m3m.ld
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -DVTABLES_IN_FLASH
  -I../neptune3pro-main/Firmware/Mainboard/Marlin-2.1.1_TJC_029/Marlin-2.1.1_TJC_029/Marlin/src/feature/neptune_mks_wifi
extra_scripts = pre:embed_web.py
monitor_speed = 115200
